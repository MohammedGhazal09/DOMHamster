name: Release completion isolated fix

on:
  push:
    branches:
      - automation/release-completion-fix-20260828
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-completion-isolated-fix
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Verify runtime
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply root-cause repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one patch target in {path_name}, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_lines(path_name: str, old_lines: list[str], new_lines: list[str]) -> None:
              replace_once(path_name, "\n".join(old_lines), "\n".join(new_lines))

          finalizer = Path(".github/workflows/release-completion-finalize.yml").read_text(
              encoding="utf-8"
          )
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Remove temporary automation"
          start = finalizer.index(start_marker) + len(start_marker)
          end = finalizer.index(end_marker, start)
          base_repair = dedent(finalizer[start:end])
          exec(compile(base_repair, "release-completion-base-repair", "exec"), {})

          replace_lines(
              "src/ui/workflow-commands.ts",
              [
                  "export function isStoreDispatchResult(value: unknown): value is StoreDispatchResult {",
                  "  if (typeof value !== 'object' || value === null) return false;",
                  "  const ok = Reflect.get(value, 'ok');",
                  "  if (typeof ok !== 'boolean') return false;",
                  "  if (ok) return true;",
                  "  const error = Reflect.get(value, 'error');",
                  "  return (",
                  "    typeof error === 'object' &&",
                  "    error !== null &&",
                  "    typeof Reflect.get(error, 'code') === 'string'",
                  "  );",
                  "}",
              ],
              [
                  "export function isStoreDispatchResult(value: unknown): value is StoreDispatchResult {",
                  "  if (typeof value !== 'object' || value === null || !('ok' in value)) return false;",
                  "  if (typeof value.ok !== 'boolean') return false;",
                  "  if (value.ok) return true;",
                  "  if (!('error' in value)) return false;",
                  "  const error = value.error;",
                  "  return (",
                  "    typeof error === 'object' &&",
                  "    error !== null &&",
                  "    'code' in error &&",
                  "    typeof error.code === 'string'",
                  "  );",
                  "}",
              ],
          )

          replace_once(
              "src/persistence/local-storage.ts",
              "  save(state: AppState): void;\n",
              "",
          )
          replace_once(
              "src/app/browser-runtime.ts",
              "    repository.save(store.getState());",
              "    void Promise.resolve(repository.save(store.getState())).catch(() => undefined);",
          )

          replace_lines(
              "tests/accessibility/automated-a11y.test.tsx",
              [
                  "    const state = workflowStates().AWAITING_APPROVAL;",
                  "    renderState(state);",
              ],
              [
                  "    const state = workflowStates().AWAITING_APPROVAL;",
                  "    if (state.draft === null) throw new Error('TEST_AWAITING_APPROVAL_DRAFT_MISSING');",
                  "    renderState(state);",
              ],
          )

          replace_lines(
              "src/app/StoreConnectedApp.tsx",
              [
                  "  | 'state'",
                  "  | 'onHumanDraftCommand'",
                  "  | 'onWorkflowCommand'",
                  "  | 'registeredToolNames'",
                  "  | 'registryErrorCodes'",
                  "> {",
              ],
              [
                  "  | 'state'",
                  "  | 'onHumanDraftCommand'",
                  "  | 'onWorkflowCommand'",
                  "> {",
              ],
          )
          replace_once(
              "src/app/StoreConnectedApp.tsx",
              "      registeredToolNames={registrySnapshot?.registeredToolNames ?? EMPTY_REGISTERED_TOOL_NAMES}",
              "      registeredToolNames={\n        registrySnapshot?.registeredToolNames ??\n        appProps.registeredToolNames ??\n        EMPTY_REGISTERED_TOOL_NAMES\n      }",
          )
          replace_once(
              "src/app/StoreConnectedApp.tsx",
              "      registryErrorCodes={registrySnapshot?.errorCodes ?? EMPTY_REGISTRY_ERRORS}",
              "      registryErrorCodes={\n        registrySnapshot?.errorCodes ?? appProps.registryErrorCodes ?? EMPTY_REGISTRY_ERRORS\n      }",
          )

          replace_lines(
              "tsconfig.node.json",
              [
                  '    "eslint.config.js",',
                  '    "tests/e2e/**/*.ts"'
              ],
              [
                  '    "eslint.config.js",',
                  '    "src/**/*.ts",',
                  '    "tests/fixtures/**/*.ts",',
                  '    "tests/helpers/**/*.ts",',
                  '    "tests/e2e/**/*.ts"'
              ],
          )
          PY

      - name: Remove superseded repair automation
        run: |
          rm -f \
            .github/release-completion-contract-preserving.py \
            .github/release-completion-repair.py \
            .github/release-completion-typecheck-fixes.py \
            .github/workflows/release-completion-finalize.yml \
            .github/workflows/release-completion-fix.yml

      - name: Normalize formatting
        run: npm run format

      - name: Verify lint gate
        run: npm run lint

      - name: Verify source
        run: npm run verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Verify bundle budget
        run: npm run verify:bundle

      - name: Verify license policy
        run: npm run verify:licenses

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate diff
        run: git diff --check

      - name: Commit verified repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: complete release verification repairs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
