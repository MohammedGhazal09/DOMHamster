name: Format WP04 implementation

on:
  push:
    branches: [implementation/wp04-store-persistence]
    paths:
      - .github/workflows/wp04-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out WP04 branch
        uses: actions/checkout@v7
        with:
          ref: implementation/wp04-store-persistence
          fetch-depth: 0

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install committed dependency graph
        run: npm ci --ignore-scripts

      - name: Apply the repository Prettier contract
        run: |
          npx prettier --write \
            src/app/ports.ts \
            src/persistence/local-storage.ts \
            tests/app/selectors.test.ts \
            tests/app/store.test.ts

      - name: Remove this one-time workflow
        run: rm .github/workflows/wp04-format.yml

      - name: Commit the formatting-only correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'style: format WP04 implementation'
          git push origin HEAD:implementation/wp04-store-persistence
