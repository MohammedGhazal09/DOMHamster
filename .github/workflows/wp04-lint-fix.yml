name: Repair and verify WP04 lint contract

on:
  push:
    branches: [implementation/wp04-store-persistence]
    paths:
      - .github/workflows/wp04-lint-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out WP04 branch
        uses: actions/checkout@v7
        with:
          ref: implementation/wp04-store-persistence
          fetch-depth: 0

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install committed dependency graph
        run: npm ci --ignore-scripts

      - name: Apply evidence-backed lint corrections
        run: python scripts/wp04-lint-fix.py

      - name: Apply autofixable lint rules and formatting
        run: |
          npx eslint . --fix
          npx prettier --write \
            src/app/selectors.ts \
            src/app/store.ts \
            src/persistence/local-storage.ts \
            tests/app/store.test.ts \
            tests/persistence/local-storage.test.ts

      - name: Verify complete WP04 source gate
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:run
          npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify browser and dependency gates
        run: |
          npm run test:e2e
          npm audit --audit-level=high

      - name: Remove one-time files and commit verified fix
        run: |
          rm .github/workflows/wp04-lint-fix.yml
          rm scripts/wp04-lint-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: satisfy WP04 strict verification'
          git push origin HEAD:implementation/wp04-store-persistence
