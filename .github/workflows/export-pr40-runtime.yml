name: Export PR40 local verification kit

on:
  push:
    branches:
      - release/manual-completion-20260828
    paths:
      - .github/workflows/export-pr40-runtime.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPORT_SHA: 28625f0a754646ba3c901f588a676153222b54ef
    steps:
      - name: Check out transfer commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Verify immutable source parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPORT_SHA"

      - name: Set up exact Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Prepare exact source, dependencies, and browser
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

          mkdir -p /tmp/domhamster-export/source
          git archive "$EXPORT_SHA" | tar -x -C /tmp/domhamster-export/source

          cd /tmp/domhamster-export/source
          npm ci --ignore-scripts
          npx playwright install chromium

          NODE_ROOT="$(dirname "$(dirname "$(command -v node)")")"
          tar -C "$NODE_ROOT" -czf /tmp/domhamster-export/node-v24.19.0-linux-x64.tgz .
          tar -C /tmp/domhamster-export -czf /tmp/domhamster-export/source-with-node-modules.tgz source
          tar -C "$HOME/.cache" -czf /tmp/domhamster-export/ms-playwright.tgz ms-playwright

          {
            printf 'source_sha=%s\n' "$EXPORT_SHA"
            printf 'node=%s\n' "$(node --version)"
            printf 'npm=%s\n' "$(npm --version)"
            printf 'package_lock_sha256=%s\n' "$(sha256sum package-lock.json | cut -d' ' -f1)"
          } > /tmp/domhamster-export/metadata.txt

      - name: Upload local verification kit
        uses: actions/upload-artifact@v7
        with:
          name: domhamster-pr40-local-verification-kit
          path: |
            /tmp/domhamster-export/node-v24.19.0-linux-x64.tgz
            /tmp/domhamster-export/source-with-node-modules.tgz
            /tmp/domhamster-export/ms-playwright.tgz
            /tmp/domhamster-export/metadata.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
