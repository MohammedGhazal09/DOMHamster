name: Apply WP05 type-narrowing fix

on:
  push:
    branches: [implementation/wp05-webmcp-contracts]
    paths:
      - .github/workflows/wp05-typefix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out WP05 branch
        uses: actions/checkout@v7
        with:
          ref: implementation/wp05-webmcp-contracts
          fetch-depth: 0

      - name: Apply the minimal compiler-directed fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/webmcp/contracts.ts')
          source = path.read_text(encoding='utf-8')
          old = ") as Readonly<Record<ToolName, WebMcpToolContract>>;"
          new = ") as unknown as Readonly<Record<ToolName, WebMcpToolContract>>;"
          if source.count(old) != 1:
              raise SystemExit('expected exactly one contract-map cast')
          path.write_text(source.replace(old, new), encoding='utf-8')

      - name: Remove one-time workflow
        run: rm .github/workflows/wp05-typefix.yml

      - name: Commit the type fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: type the complete WebMCP contract index'
          git push origin HEAD:implementation/wp05-webmcp-contracts
