name: WP03 phase importer

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  import-phase:
    if: startsWith(github.event.issue.title, '[WP03 import ')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: implementation/wp03-workflow
      BASE_BUNDLE_SHA256: bcb64c80477912b5f2ea10e9f15b568795acaff96f48c035920d7a8da31e83ce
      FEATURE_BUNDLE_SHA256: a8e7f7f523aad0f98fde93ad1e2d10d41c97e59ce03ac97926bfe2690e30c8d6
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Restore verified local commit bundles
        shell: bash
        run: |
          cat .github/wp03-base/part-* | tr -d '\n' > /tmp/wp03-base.bundle.b64
          base64 --decode /tmp/wp03-base.bundle.b64 > /tmp/wp03-base.bundle
          echo "$BASE_BUNDLE_SHA256  /tmp/wp03-base.bundle" | sha256sum --check
          git bundle verify /tmp/wp03-base.bundle
          git fetch /tmp/wp03-base.bundle refs/heads/main:refs/remotes/wp03/base

          cat .github/wp03-import/part-* | tr -d '\n' > /tmp/wp03-feature.bundle.b64
          base64 --decode /tmp/wp03-feature.bundle.b64 > /tmp/wp03-feature.bundle
          echo "$FEATURE_BUNDLE_SHA256  /tmp/wp03-feature.bundle" | sha256sum --check
          git bundle verify /tmp/wp03-feature.bundle
          git fetch /tmp/wp03-feature.bundle \
            refs/heads/implementation/wp03-workflow:refs/remotes/wp03/source

      - name: Configure Git author
        run: |
          git config user.name 'Mohammed Ghazal'
          git config user.email 'mohammedghazal01@outlook.com'
          git fetch origin main "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

      - name: Import requested phase
        id: import
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          case "$ISSUE_TITLE" in
            '[WP03 import RED]')
              git reset --hard origin/main
              git cherry-pick eefa6c6
              printf 'WP03 expected RED evidence gate.\n' > .wp03-red
              git add .wp03-red
              git commit -m 'test: mark WP03 expected RED gate'
              ;;
            '[WP03 import GREEN1]')
              test -f .wp03-red
              git rm .wp03-red
              git cherry-pick --no-commit bc3ba50
              git commit -m 'feat: implement coordination workflow commands'
              ;;
            '[WP03 import FORMAT]')
              npm ci --ignore-scripts
              npx prettier --write \
                src/domain/commands.ts \
                src/domain/state-machine.ts \
                tests/domain/approval.test.ts \
                tests/domain/commands.test.ts \
                tests/domain/state-machine.test.ts
              git add \
                src/domain/commands.ts \
                src/domain/state-machine.ts \
                tests/domain/approval.test.ts \
                tests/domain/commands.test.ts \
                tests/domain/state-machine.test.ts
              git commit -m 'style: format WP03 workflow implementation'
              ;;
            '[WP03 import RED2]')
              git cherry-pick 481bc4f
              ;;
            '[WP03 import GREEN2]')
              git cherry-pick f70fd3f
              ;;
            *)
              echo "Unsupported phase title: $ISSUE_TITLE" >&2
              exit 64
              ;;
          esac
          git push origin "HEAD:$TARGET_BRANCH" --force-with-lease
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record result on trigger issue
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Imported **${context.payload.issue.title}** to \`${{ steps.import.outputs.head_sha }}\`.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });
