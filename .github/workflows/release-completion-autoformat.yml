name: Release completion autofix

on:
  push:
    branches:
      - automation/release-completion-20260828

permissions:
  contents: write

concurrency:
  group: release-completion-autofix
  cancel-in-progress: false

jobs:
  autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release-completion branch
        uses: actions/checkout@v7
        with:
          ref: automation/release-completion-20260828

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Verify runtime
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply mechanical format and lint fixes
        run: |
          npm run format
          npm run lint -- --fix || true
          npm run format
          git diff --check

      - name: Commit mechanical fixes when present
        run: |
          if git diff --quiet; then
            echo "No mechanical fixes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply mechanical lint fixes"
          git push origin HEAD:automation/release-completion-20260828
