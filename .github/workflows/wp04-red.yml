name: WP04 RED evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .wp04-red
      - .github/workflows/wp04-red.yml
      - src/app/ports.ts
      - src/app/store.ts
      - src/app/selectors.ts
      - src/persistence/local-storage.ts
      - tests/app/**
      - tests/persistence/**
      - tests/helpers/**
      - tsconfig.app.json

permissions:
  contents: read

jobs:
  store-persistence-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install committed dependency graph
        run: npm ci --ignore-scripts

      - name: Observe expected missing-module RED result
        if: hashFiles('.wp04-red') != ''
        shell: bash
        run: |
          set +e
          npm run test:run -- \
            tests/app/store.test.ts \
            tests/app/selectors.test.ts \
            tests/persistence/local-storage.test.ts \
            > wp04-red-test.log 2>&1
          test_status=$?
          set -e
          cat wp04-red-test.log

          test "$test_status" -ne 0
          grep -Eqi '(failed to resolve import|cannot find module|could not resolve).*(src/app/store|\.\./\.\./src/app/store)' wp04-red-test.log
          grep -Eqi '(failed to resolve import|cannot find module|could not resolve).*(src/app/selectors|\.\./\.\./src/app/selectors)' wp04-red-test.log
          grep -Eqi '(failed to resolve import|cannot find module|could not resolve).*(src/persistence/local-storage|\.\./\.\./src/persistence/local-storage)' wp04-red-test.log
          echo 'DOMHAMSTER_WP04_EXPECTED_RED_CONFIRMED'

      - name: Confirm RED was already recorded for GREEN revisions
        if: hashFiles('.wp04-red') == ''
        run: echo 'WP04 RED evidence was already recorded; repository CI owns GREEN verification.'
