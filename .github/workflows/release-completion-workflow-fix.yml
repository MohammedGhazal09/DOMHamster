name: Release completion workflow fix

on:
  push:
    branches:
      - automation/release-completion-20260828

permissions:
  contents: write

jobs:
  fix-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/release-completion-20260828

      - name: Scope helper evidence to product and test source
        run: |
          sed -i "s/git grep -l 'registrySnapshotKey'/git grep -l 'registrySnapshotKey' -- src tests/" .github/workflows/release-completion-autoformat.yml
          sed -i "s/git grep -l 'formatApprovalCountdown'/git grep -l 'formatApprovalCountdown' -- src tests/" .github/workflows/release-completion-autoformat.yml
          git diff --check

      - name: Commit workflow correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release-completion-autoformat.yml
          git commit -m "chore: scope release repair evidence"
          git push origin HEAD:automation/release-completion-20260828
