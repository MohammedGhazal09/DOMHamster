name: Diagnose governance transfer payloads

on:
  push:
    branches: [governance/restore-plans-v0171]
    paths:
      - .github/workflows/restore-plans-v0171.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out governance branch
        uses: actions/checkout@v7
        with:
          ref: governance/restore-plans-v0171
          fetch-depth: 0

      - name: Report transfer chunk identities
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          expected = {
              '.plan-update/master.patch.gz.b64/00': (5292, 'ffa28afdb54ba621643148e9a46322d88046a4af5a4129a32eef5141382e4cce'),
              '.plan-update/impl.gz.b64/00': (6000, '394b5023336e64d3e46b3ae6f50354d5d1ab4afe6cba7e8ef112df96eeb52417'),
              '.plan-update/impl.gz.b64/01': (6000, 'ef048a76825213f240be300f5ae3822b2c7819d4da0cb168568062fd255ba3c8'),
              '.plan-update/impl.gz.b64/02': (6000, '9fb8ae2cfe6e83805827c1d3bf975bee45333e0958b6bb8cb6a1ee363e2efe94'),
              '.plan-update/impl.gz.b64/03': (6000, 'a78199c1de781416c9fb750894128b03e1e36c7cd825a1311f61b7ad4331ebf4'),
              '.plan-update/impl.gz.b64/04': (552, 'afb1ca0ca2719e69a16868d43b02856f20ff457707bafc2c23154c2d136f6bbc'),
          }
          failed = False
          for path_string, (expected_size, expected_hash) in expected.items():
              text = Path(path_string).read_text(encoding='utf-8').strip()
              actual_hash = hashlib.sha256(text.encode()).hexdigest()
              ok = len(text) == expected_size and actual_hash == expected_hash
              print(f'{path_string}: size={len(text)} sha256={actual_hash} expected_size={expected_size} expected_sha256={expected_hash} ok={ok}')
              failed = failed or not ok

          combined = ''.join(
              Path(f'.plan-update/impl.gz.b64/{index}').read_text(encoding='utf-8').strip()
              for index in ('00', '01', '02', '03', '04')
          )
          compressed = base64.b64decode(combined, validate=True)
          print(f'implementation combined base64={len(combined)} compressed={len(compressed)} compressed_sha256={hashlib.sha256(compressed).hexdigest()}')
          try:
              data = gzip.decompress(compressed)
          except Exception as error:
              print(f'implementation decompression error: {error!r}')
              failed = True
          else:
              print(f'implementation raw={len(data)} raw_sha256={hashlib.sha256(data).hexdigest()}')

          if failed:
              raise SystemExit(1)
          PY
