name: Format WP07 design lock

on:
  push:
    branches: [implementation/wp07-shell]
    paths:
      - .github/workflows/wp07-format-design.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out WP07 branch
        uses: actions/checkout@v7
        with:
          ref: implementation/wp07-shell
          fetch-depth: 0

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install committed dependency graph
        run: npm ci --ignore-scripts

      - name: Format design-system documentation
        run: npx prettier --write docs/design/design-system.md

      - name: Remove one-time formatter
        run: rm .github/workflows/wp07-format-design.yml

      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'style: format WP07 design system'
          git push origin HEAD:implementation/wp07-shell
