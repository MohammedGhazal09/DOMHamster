name: WP03 governance finalizer

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    if: github.event.issue.title == '[WP03 governance finalize]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_BRANCH: governance/wp03-finalize
      PLAN_GZIP_SHA256: de8074babe6a5689ee63de9548de8a37a3dc570e641e591b3163c9daafb1771e
      PLAN_OUTPUT_SHA256: 696b5669e47687ac4aaf269c735f27633da80b1bd662eba28c408f261dd9a622
    steps:
      - name: Check out governance branch
        uses: actions/checkout@v7
        with:
          ref: governance/wp03-finalize
          fetch-depth: 0

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Restore and verify detailed implementation plan
        shell: bash
        run: |
          mkdir -p docs/superpowers/plans
          tr -d '\n' < .github/governance/implementation-plan-00 \
            | base64 --decode > /tmp/domhamster-implementation-plan.md.gz
          echo "$PLAN_GZIP_SHA256  /tmp/domhamster-implementation-plan.md.gz" | sha256sum --check
          gzip --decompress --stdout /tmp/domhamster-implementation-plan.md.gz \
            > docs/superpowers/plans/2026-08-26-domhamster-implementation.md
          echo "$PLAN_OUTPUT_SHA256  docs/superpowers/plans/2026-08-26-domhamster-implementation.md" \
            | sha256sum --check

      - name: Verify governance documents before cleanup
        shell: bash
        run: |
          test -s MASTERPLAN.md
          test -s README.md
          test -s docs/execution/WP03_STATUS.md
          grep -Fq '**Version:** 0.17.0' MASTERPLAN.md
          grep -Fq 'WP00 through WP03 are complete' README.md
          grep -Fq '33016239969' docs/execution/WP03_STATUS.md
          grep -Fq 'Task 5: WP04' docs/superpowers/plans/2026-08-26-domhamster-implementation.md

      - name: Remove temporary WP03 transfer infrastructure
        shell: bash
        run: |
          rm -rf \
            .github/governance \
            .github/wp03-base \
            .github/wp03-import
          rm -f \
            .github/workflows/wp03-import.yml \
            .github/workflows/wp03-invariant-import.yml \
            .github/workflows/wp03-lintfix.yml \
            .github/workflows/wp03-red.yml \
            .github/workflows/wp03-red2.yml \
            .github/workflows/wp03-governance-finalize.yml

      - name: Install committed dependency graph
        run: npm ci --ignore-scripts

      - name: Format governed Markdown surfaces
        run: npx prettier --write README.md docs/execution/WP03_STATUS.md

      - name: Run full pre-commit verification
        shell: bash
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:run
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm audit --audit-level=high

      - name: Commit verified governance checkpoint
        id: commit
        shell: bash
        run: |
          git config user.name 'Mohammed Ghazal'
          git config user.email 'mohammedghazal01@outlook.com'
          git add -A
          git commit -m 'docs: record WP03 completion and restore project plans'
          git push origin HEAD:governance/wp03-finalize
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record result
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Governance checkpoint 0.17.0 was reconstructed, cleaned, fully verified, and pushed at \`${{ steps.commit.outputs.head_sha }}\`.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });
