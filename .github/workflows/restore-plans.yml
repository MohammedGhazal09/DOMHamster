name: Recover governance payload evidence

on:
  push:
    branches: [governance/restore-plans]
    paths:
      - .github/workflows/restore-plans.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out governance branch
        uses: actions/checkout@v7
        with:
          ref: governance/restore-plans
          fetch-depth: 0

      - name: Recover the intact master plan and partial implementation plan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import zlib

          def decoded_parts(parts: list[str]) -> bytes:
              compressed = []
              for part_name in parts:
                  encoded = Path(part_name).read_text(encoding='utf-8').strip()
                  if not encoded:
                      raise RuntimeError(f'{part_name}: empty Base64 payload')
                  encoded += '=' * (-len(encoded) % 4)
                  compressed.append(base64.b64decode(encoded, validate=True))
              return b''.join(compressed)

          master_compressed = decoded_parts([
              '.plan-payload/master/00.b64',
              '.plan-payload/master/01.b64',
              '.plan-payload/master/02.b64',
              '.plan-payload/fix/master03/00.b64',
              '.plan-payload/fix/master03/01.b64',
              '.plan-payload/fix/master03/02.b64',
              '.plan-payload/master/04.b64',
              '.plan-payload/master/05.b64',
              '.plan-payload/fix/master06/00.b64',
              '.plan-payload/fix/master06/01.b64',
              '.plan-payload/fix/master06/02.b64',
              '.plan-payload/master/07.b64',
              '.plan-payload/master/08.b64',
          ])
          master = gzip.decompress(master_compressed)
          if len(master) != 252003:
              raise RuntimeError(f'Unexpected master size: {len(master)}')
          if hashlib.sha256(master).hexdigest() != '644a52f898cd68dfb4fad70203e2888556d8e5c98a45999da5a88db375ad4a54':
              raise RuntimeError('Unexpected master hash')
          Path('MASTERPLAN.md').write_bytes(master)

          impl_compressed = decoded_parts([
              '.plan-payload/impl/00.b64',
              '.plan-payload/fix/impl01/00.b64',
              '.plan-payload/fix/impl01/01.b64',
              '.plan-payload/fix/impl01/02.b64',
          ])
          decoder = zlib.decompressobj(16 + zlib.MAX_WBITS)
          partial = decoder.decompress(impl_compressed)
          Path('IMPLEMENTATION_PLAN.partial.md').write_bytes(partial)
          Path('IMPLEMENTATION_PLAN.recovery.txt').write_text(
              f'compressed_bytes={len(impl_compressed)}\n'
              f'partial_bytes={len(partial)}\n'
              f'eof={decoder.eof}\n'
              f'partial_sha256={hashlib.sha256(partial).hexdigest()}\n',
              encoding='utf-8',
          )
          print(Path('IMPLEMENTATION_PLAN.recovery.txt').read_text(encoding='utf-8'))
          PY

      - name: Upload recovered governance evidence
        uses: actions/upload-artifact@v7
        with:
          name: recovered-governance-payloads
          path: |
            MASTERPLAN.md
            IMPLEMENTATION_PLAN.partial.md
            IMPLEMENTATION_PLAN.recovery.txt
          retention-days: 7
