name: WP00 target RED verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-wp00-target.yml
      - docs/execution/WP00_MAIN_TRIGGER.md
  pull_request:
    branches: [main]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  red-contract:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[WP00 trigger]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out WP00 implementation branch
        uses: actions/checkout@v7
        with:
          ref: implementation/wp00-toolchain
          fetch-depth: 0

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Verify runtime
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Verify exact dependency policy
        run: node scripts/verify-exact-dependencies.mjs

      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install generated dependency graph
        run: npm ci --ignore-scripts

      - name: Commit generated lockfile to the WP00 branch
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json is already committed and unchanged.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: commit WP00 lockfile'
            git push origin HEAD:implementation/wp00-toolchain
          fi

      - name: Audit dependency graph
        run: npm audit --audit-level=high --json > npm-audit.json

      - name: Verify static toolchain contracts
        run: node --test tests/toolchain/wp00-contract.test.mjs

      - name: Observe required RED component test
        shell: bash
        run: |
          set +e
          npm run test:run -- src/app/App.test.tsx > wp00-red-test.log 2>&1
          test_status=$?
          set -e
          cat wp00-red-test.log
          test "$test_status" -ne 0
          grep -Eqi '(cannot find module|failed to resolve import|could not resolve).*(\./App|src/app/App)' wp00-red-test.log
          echo 'DOMHAMSTER_EXPECTED_RED_CONFIRMED'

      - name: Upload RED evidence
        uses: actions/upload-artifact@v7
        with:
          name: wp00-red-evidence
          path: |
            package.json
            package-lock.json
            npm-audit.json
            wp00-red-test.log
          retention-days: 7
          if-no-files-found: error
