name: WP00 target GREEN verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-wp00-target.yml
      - docs/execution/WP00_MAIN_TRIGGER.md
  pull_request:
    branches: [main]
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  green-contract:
    if: >-
      (github.event_name != 'issues' || startsWith(github.event.issue.title, '[WP00 trigger]')) &&
      (github.event_name != 'issue_comment' || contains(github.event.comment.body, '/verify-wp00-green'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out WP00 implementation branch
        uses: actions/checkout@v7
        with:
          ref: implementation/wp00-toolchain
          fetch-depth: 0

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify runtime
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Install committed dependency graph
        run: npm ci --ignore-scripts

      - name: Verify exact dependency policy
        run: node scripts/verify-exact-dependencies.mjs

      - name: Audit dependency graph
        run: npm audit --audit-level=high --json > npm-audit.json

      - name: Verify formatting
        run: npm run format:check

      - name: Verify lint
        run: npm run lint

      - name: Verify types
        run: npm run typecheck

      - name: Verify complete Vitest suite
        run: npm run test:run

      - name: Verify production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify browser smoke test
        run: npm run test:e2e

      - name: Upload WP00 GREEN evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wp00-green-evidence
          path: |
            npm-audit.json
            dist/
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
