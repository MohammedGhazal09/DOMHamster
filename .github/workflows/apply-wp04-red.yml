name: Apply WP04 RED contracts

on:
  push:
    branches: [implementation/wp04-store-persistence]
    paths:
      - .github/workflows/apply-wp04-red.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out WP04 branch
        uses: actions/checkout@v7
        with:
          ref: implementation/wp04-store-persistence
          fetch-depth: 0

      - name: Reconstruct and verify the RED patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          expected_chunks = {
              '.wp04-transfer/red.gz.b64/00': (6000, '7b0aff07991b0f7579ce64f790f2395649487b7af22f0859d6fc639e637f438a'),
              '.wp04-transfer/red.gz.b64/01': (3944, 'bdf3339700f4b3457fab08028217fb149ee1f532029efe14dbcdbdfe8eeaa3d1'),
          }
          encoded_parts = []
          for path_string, (expected_size, expected_hash) in expected_chunks.items():
              text = Path(path_string).read_text(encoding='utf-8').strip()
              actual_hash = hashlib.sha256(text.encode()).hexdigest()
              if len(text) != expected_size or actual_hash != expected_hash:
                  raise RuntimeError(
                      f'{path_string}: size={len(text)} sha256={actual_hash}; '
                      f'expected size={expected_size} sha256={expected_hash}'
                  )
              encoded_parts.append(text)

          compressed = base64.b64decode(''.join(encoded_parts), validate=True)
          compressed_hash = hashlib.sha256(compressed).hexdigest()
          if len(compressed) != 7456 or compressed_hash != 'b1193561a766b72fa58179d6d4a7ded75b9d64a23fdd0e14c95dbdc32dca2f63':
              raise RuntimeError(
                  f'Compressed RED patch: size={len(compressed)} sha256={compressed_hash}'
              )

          patch = gzip.decompress(compressed)
          patch_hash = hashlib.sha256(patch).hexdigest()
          if len(patch) != 34144 or patch_hash != '23fb0fdaf28a0be0ea4d6397fa3c58c1c8f795e7ff2cd661a772d9fd7410dacf':
              raise RuntimeError(f'RED patch: size={len(patch)} sha256={patch_hash}')
          Path('/tmp/DOMHamster_WP04_RED.patch').write_bytes(patch)
          print(f'Verified RED patch: {len(patch)} bytes, sha256={patch_hash}')
          PY

      - name: Enforce the test-first boundary
        run: |
          test ! -e src/app/store.ts
          test ! -e src/app/selectors.ts
          test ! -e src/persistence/local-storage.ts

      - name: Apply and commit tests without the dedicated workflow file
        shell: bash
        run: |
          git config user.name 'Mohammed Ghazal'
          git config user.email 'mohammedghazal01@outlook.com'
          git apply --index --exclude=.github/workflows/wp04-red.yml /tmp/DOMHamster_WP04_RED.patch
          rm -rf .wp04-transfer
          rm .github/workflows/apply-wp04-red.yml
          git add -A
          git diff --cached --check
          git commit -m 'test: define WP04 store and persistence contracts'

      - name: Publish the test-only branch
        run: git push origin HEAD:implementation/wp04-store-persistence
