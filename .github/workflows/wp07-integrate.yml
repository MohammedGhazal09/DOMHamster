name: Apply WP07 UI integration

on:
  push:
    branches: [implementation/wp07-shell]
    paths:
      - .github/workflows/wp07-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out WP07 branch
        uses: actions/checkout@v7
        with:
          ref: implementation/wp07-shell
          fetch-depth: 0

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install committed dependency graph
        run: npm ci --ignore-scripts

      - name: Correct the multi-match volunteer assertion
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/ui/app-shell.test.tsx')
          text = path.read_text(encoding='utf-8')
          old = "    expect(within(volunteerRegion).getByText(/Driving/)).toBeVisible();"
          new = "    expect(within(volunteerRegion).getAllByText(/Driving/).length).toBeGreaterThan(0);"
          if text.count(old) != 1:
              raise SystemExit('expected one volunteer Driving assertion')
          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Remove one-time workflow
        run: rm .github/workflows/wp07-integrate.yml

      - name: Format WP07 implementation
        run: |
          npx prettier --write \
            src/app/App.tsx \
            src/app/default-state.ts \
            src/app/styles.css \
            src/ui/*.tsx \
            tests/ui/app-shell.test.tsx \
            tests/e2e/ready.spec.ts \
            tsconfig.app.json

      - name: Commit integrated WP07 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: integrate the judge-facing READY workspace'
          git push origin HEAD:implementation/wp07-shell
