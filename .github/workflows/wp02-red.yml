name: WP02 RED evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .wp02-red
      - src/domain/validation.ts
      - tests/domain/validation.test.ts
      - tests/fixtures/drafts.ts

permissions:
  contents: read

jobs:
  validation-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install committed dependency graph
        run: npm ci --ignore-scripts

      - name: Observe the expected missing-validation RED result
        if: hashFiles('.wp02-red') != ''
        shell: bash
        run: |
          set +e
          npm run test:run -- tests/domain/validation.test.ts > wp02-red-test.log 2>&1
          test_status=$?
          set -e
          cat wp02-red-test.log

          test "$test_status" -ne 0
          grep -Eqi '(failed to resolve import|cannot find module|could not resolve).*(src/domain/validation|\.\./\.\./src/domain/validation)' wp02-red-test.log
          echo 'DOMHAMSTER_WP02_EXPECTED_RED_CONFIRMED'

      - name: Confirm RED was already recorded for GREEN revisions
        if: hashFiles('.wp02-red') == ''
        run: echo 'WP02 RED evidence was already recorded; normal CI owns GREEN verification.'
