name: Apply WP06 runtime integration

on:
  push:
    branches: [implementation/wp06-runtime]
    paths:
      - .github/workflows/wp06-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out WP06 branch
        uses: actions/checkout@v7
        with:
          ref: implementation/wp06-runtime
          fetch-depth: 0

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install committed dependency graph
        run: npm ci --ignore-scripts

      - name: Add the audited contact-access command
        shell: python
        run: |
          from pathlib import Path

          commands_path = Path('src/domain/commands.ts')
          commands = commands_path.read_text(encoding='utf-8')

          replacements = [
              (
                  "  | 'ASSIGNMENT_NOT_FOUND'\n  | 'APPROVAL_NOT_EXPIRED'",
                  "  | 'ASSIGNMENT_NOT_FOUND'\n  | 'REQUEST_NOT_ASSIGNED'\n  | 'APPROVAL_NOT_EXPIRED'",
              ),
              (
                  "export interface CommitPlanCommand extends CommandBase {\n  readonly type: 'COMMIT_PLAN';\n  readonly expectedDraftVersion: number;\n}\n",
                  "export interface CommitPlanCommand extends CommandBase {\n  readonly type: 'COMMIT_PLAN';\n  readonly expectedDraftVersion: number;\n}\n\nexport interface AccessContactsCommand extends CommandBase {\n  readonly type: 'ACCESS_CONTACTS';\n  readonly requestIds: readonly RequestId[];\n}\n",
              ),
              (
                  "  | ApprovalExpiresCommand\n  | CommitPlanCommand;",
                  "  | ApprovalExpiresCommand\n  | CommitPlanCommand\n  | AccessContactsCommand;",
              ),
          ]

          for old, new in replacements:
              if commands.count(old) != 1:
                  raise SystemExit(f'commands replacement mismatch: {old!r}')
              commands = commands.replace(old, new)

          access_function = '''function accessContacts(
            state: Extract<AppState, { workflowState: 'COMMITTED' }>,
            command: AccessContactsCommand,
            dependencies: CommandDependencies,
          ): CommandResult {
            const requestIds = command.requestIds;
            if (
              requestIds.length === 0 ||
              requestIds.length > state.scenario.requests.length ||
              new Set(requestIds).size !== requestIds.length
            ) {
              return failure(state, 'INVALID_INPUT');
            }

            const knownRequests = new Set(state.scenario.requests.map(({ id }) => id));
            const assignmentsByRequest = new Map(
              state.committedPlan.assignments.map((assignment) => [assignment.requestId, assignment]),
            );

            for (const id of requestIds) {
              if (!knownRequests.has(id)) {
                return failure(state, 'UNKNOWN_REQUEST');
              }
              const assignment = assignmentsByRequest.get(id);
              if (assignment?.status !== 'committed' || assignment.volunteerId === null) {
                return failure(state, 'REQUEST_NOT_ASSIGNED');
              }
            }

            const auditHistory = append(
              state,
              'CONTACTS_ACCESSED',
              command.actor,
              state.committedPlan.draftVersion,
              `Agent accessed dispatch contacts for ${requestIds.length} assigned request${
                requestIds.length === 1 ? '' : 's'
              }.`,
              dependencies,
            );

            return success(
              Object.freeze({
                workflowState: 'COMMITTED',
                scenario: state.scenario,
                draft: null,
                approval: null,
                committedPlan: state.committedPlan,
                auditHistory,
              }),
            );
          }

          '''

          marker = 'function resetDemo('
          if commands.count(marker) != 1:
              raise SystemExit('resetDemo marker mismatch')
          commands = commands.replace(marker, access_function + marker)

          switch_marker = "  switch (command.type) {\n    case 'RESET_DEMO':"
          switch_replacement = (
              "  switch (command.type) {\n"
              "    case 'ACCESS_CONTACTS':\n"
              "      return accessContacts(\n"
              "        state as Extract<AppState, { workflowState: 'COMMITTED' }>,\n"
              "        command,\n"
              "        dependencies,\n"
              "      );\n"
              "    case 'RESET_DEMO':"
          )
          if commands.count(switch_marker) != 1:
              raise SystemExit('command switch marker mismatch')
          commands = commands.replace(switch_marker, switch_replacement)
          commands_path.write_text(commands, encoding='utf-8')

          state_path = Path('src/domain/state-machine.ts')
          state_machine = state_path.read_text(encoding='utf-8')
          event_old = "  | 'APPROVAL_EXPIRES'\n  | 'COMMIT_PLAN';"
          event_new = "  | 'APPROVAL_EXPIRES'\n  | 'COMMIT_PLAN'\n  | 'ACCESS_CONTACTS';"
          if state_machine.count(event_old) != 1:
              raise SystemExit('workflow event marker mismatch')
          state_machine = state_machine.replace(event_old, event_new)

          transition_old = "  if (event === 'APPROVAL_EXPIRES') {\n    return actor === 'system' && state === 'APPROVED';\n  }\n\n  return actor === 'agent' && state === 'APPROVED';"
          transition_new = "  if (event === 'APPROVAL_EXPIRES') {\n    return actor === 'system' && state === 'APPROVED';\n  }\n\n  if (event === 'ACCESS_CONTACTS') {\n    return actor === 'agent' && state === 'COMMITTED';\n  }\n\n  return actor === 'agent' && state === 'APPROVED';"
          if state_machine.count(transition_old) != 1:
              raise SystemExit('workflow transition marker mismatch')
          state_machine = state_machine.replace(transition_old, transition_new)
          state_path.write_text(state_machine, encoding='utf-8')

      - name: Remove RED marker and one-time workflow
        run: |
          rm -f .wp06-red
          rm .github/workflows/wp06-integrate.yml

      - name: Format WP06 files
        run: |
          npx prettier --write \
            src/webmcp/handlers.ts \
            src/webmcp/capability.ts \
            src/webmcp/registry.ts \
            src/diagnostics/diagnostics.ts \
            src/domain/commands.ts \
            src/domain/state-machine.ts \
            tests/webmcp/handlers.test.ts \
            tests/webmcp/capability.test.ts \
            tests/webmcp/registry.test.ts \
            tests/diagnostics/diagnostics.test.ts \
            tests/domain/contact-access.test.ts \
            tests/helpers/webmcp-fixtures.ts \
            tsconfig.app.json

      - name: Commit integrated WP06 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: integrate WebMCP runtime and contact auditing'
          git push origin HEAD:implementation/wp06-runtime
