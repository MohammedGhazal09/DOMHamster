name: Release completion diagnostic

on:
  push:
    branches:
      - automation/release-completion-diagnostic-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Reproduce candidate repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path(".github/workflows/release-completion-fix.yml").read_text(
              encoding="utf-8"
          )
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Remove superseded repair automation"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          repair = dedent(workflow[start:end])
          exec(compile(repair, "release-completion-candidate-repair", "exec"), {})
          PY

      - name: Match final candidate tree
        run: |
          rm -f \
            .github/release-completion-contract-preserving.py \
            .github/release-completion-repair.py \
            .github/release-completion-typecheck-fixes.py \
            .github/workflows/release-completion-finalize.yml \
            .github/workflows/release-completion-fix.yml \
            .github/workflows/release-completion-diagnostic.yml

      - name: Normalize formatting quietly
        run: npm run format -- --log-level silent

      - name: Report every failing unit test
        run: |
          set +e
          npx vitest run --reporter=json --outputFile=/tmp/domhamster-vitest.json \
            > /tmp/domhamster-vitest-console.log 2>&1
          status=$?
          echo "DOMHAMSTER_VITEST_EXIT=${status}"
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          report_path = Path('/tmp/domhamster-vitest.json')
          if not report_path.exists():
              print(Path('/tmp/domhamster-vitest-console.log').read_text(encoding='utf-8')[-12000:])
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding='utf-8'))
          ansi = re.compile(r'\x1b\[[0-9;]*m')
          failures = []
          for suite in report.get('testResults', []):
              suite_name = suite.get('name', '<unknown suite>')
              for assertion in suite.get('assertionResults', []):
                  if assertion.get('status') != 'failed':
                      continue
                  title = ' > '.join([*assertion.get('ancestorTitles', []), assertion.get('title', '')])
                  messages = assertion.get('failureMessages', [])
                  message = ansi.sub('', messages[0] if messages else '<no failure message>')
                  failures.append((suite_name, title, message))

          print(f'DOMHAMSTER_FAILED_TESTS={len(failures)}')
          for index, (suite_name, title, message) in enumerate(failures, start=1):
              print(f'----- FAILURE {index} -----')
              print(suite_name)
              print(title)
              print(message[:3500])
          PY
          exit "${status}"
