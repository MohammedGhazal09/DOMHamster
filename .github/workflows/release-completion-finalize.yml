name: Release completion finalizer

on:
  push:
    branches:
      - automation/release-completion-20260828
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-completion-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Apply release completion repairs
        run: |
          python3 .github/release-completion-contract-preserving.py
          python3 .github/release-completion-typecheck-fixes.py
          python3 .github/release-completion-repair.py app

      - name: Harden permissive callback handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"patch target not found in {path_name}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/ui/workflow-commands.ts",
              """export type WorkflowCommandHandler = (
            command: WorkflowCommand,
          ) => StoreDispatchResult | undefined | Promise<StoreDispatchResult | undefined>;

          export async function executeWorkflowCommand(
          """,
              """export type WorkflowCommandHandler = (command: WorkflowCommand) => unknown;

          export function isStoreDispatchResult(value: unknown): value is StoreDispatchResult {
            return (
              typeof value === 'object' &&
              value !== null &&
              'ok' in value &&
              typeof value.ok === 'boolean'
            );
          }

          export async function executeWorkflowCommand(
          """,
          )
          replace_once(
              "src/ui/workflow-commands.ts",
              """    const result = await onCommand(command);
              if (result !== undefined && !result.ok) {
                onAnnouncement(`Action was not accepted: ${result.error.code}.`);
                return false;
              }
          """,
              """    const result: unknown = await onCommand(command);
              if (result !== undefined) {
                if (!isStoreDispatchResult(result)) {
                  throw new TypeError('Unexpected workflow command result.');
                }
                if (!result.ok) {
                  onAnnouncement(`Action was not accepted: ${result.error.code}.`);
                  return false;
                }
              }
          """,
          )
          replace_once(
              "src/app/App.tsx",
              """import {
            executeWorkflowCommand,
            type WorkflowCommand,
          """,
              """import {
            executeWorkflowCommand,
            isStoreDispatchResult,
            type WorkflowCommand,
          """,
          )
          replace_once(
              "src/app/App.tsx",
              """        const result = await baseCommandHandler(command);
                  if (result !== undefined && !result.ok) {
                    setRecentErrorCodes((previous) => [...previous, result.error.code].slice(-10));
                  }
                  return result;
          """,
              """        const result: unknown = await baseCommandHandler(command);
                  if (result !== undefined) {
                    if (!isStoreDispatchResult(result)) {
                      throw new TypeError('Unexpected workflow command result.');
                    }
                    if (!result.ok) {
                      setRecentErrorCodes((previous) => [...previous, result.error.code].slice(-10));
                    }
                  }
                  return result;
          """,
          )
          replace_once(
              "src/ui/AssignmentTable.tsx",
              """import type { WorkflowCommandHandler } from './workflow-commands.ts';
          """,
              """import { isStoreDispatchResult, type WorkflowCommandHandler } from './workflow-commands.ts';
          """,
          )
          replace_once(
              "src/ui/AssignmentTable.tsx",
              """    const result = await onCommand(command);
              if (result !== undefined && !result.ok) {
                onAnnouncement(`Assignment change was not accepted: ${result.error.code}.`);
                return;
              }
          """,
              """    const result: unknown = await onCommand(command);
              if (result !== undefined) {
                if (!isStoreDispatchResult(result)) {
                  throw new TypeError('Unexpected workflow command result.');
                }
                if (!result.ok) {
                  onAnnouncement(`Assignment change was not accepted: ${result.error.code}.`);
                  return;
                }
              }
          """,
          )
          PY

      - name: Remove temporary automation
        run: |
          rm -f \
            .github/release-completion-contract-preserving.py \
            .github/release-completion-repair.py \
            .github/release-completion-typecheck-fixes.py \
            .github/workflows/release-completion-finalize.yml

      - name: Normalize formatting
        run: npm run format

      - name: Verify release gate
        run: npm run verify

      - name: Run browser tests
        run: npm run test:e2e

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate diff
        run: git diff --check

      - name: Commit verified repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: complete release verification repairs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
