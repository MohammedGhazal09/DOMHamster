name: Release completion finalizer

on:
  push:
    branches:
      - automation/release-completion-20260828
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-completion-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Apply release completion repairs
        run: |
          python3 .github/release-completion-contract-preserving.py
          python3 .github/release-completion-typecheck-fixes.py
          python3 .github/release-completion-repair.py --phase app

      - name: Restore permissive callback contract safely
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/ui/workflow-commands.ts")
          text = path.read_text(encoding="utf-8")
          old_type = """export type WorkflowCommandHandler = (
            command: WorkflowCommand,
          ) => StoreDispatchResult | undefined | Promise<StoreDispatchResult | undefined>;

          export async function executeWorkflowCommand(
          """
          new_type = """export type WorkflowCommandHandler = (command: WorkflowCommand) => unknown;

          function isStoreDispatchResult(value: unknown): value is StoreDispatchResult {
            return (
              typeof value === 'object' &&
              value !== null &&
              'ok' in value &&
              typeof value.ok === 'boolean'
            );
          }

          export async function executeWorkflowCommand(
          """
          old_result = """    const result = await onCommand(command);
              if (result !== undefined && !result.ok) {
                onAnnouncement(`Action was not accepted: ${result.error.code}.`);
                return false;
              }
          """
          new_result = """    const result: unknown = await onCommand(command);
              if (result !== undefined) {
                if (!isStoreDispatchResult(result)) {
                  throw new TypeError('Unexpected workflow command result.');
                }
                if (!result.ok) {
                  onAnnouncement(`Action was not accepted: ${result.error.code}.`);
                  return false;
                }
              }
          """
          if old_type not in text or old_result not in text:
              raise SystemExit("workflow command callback patch target not found")
          text = text.replace(old_type, new_type, 1).replace(old_result, new_result, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove temporary automation
        run: |
          rm -f \
            .github/release-completion-contract-preserving.py \
            .github/release-completion-repair.py \
            .github/release-completion-typecheck-fixes.py \
            .github/workflows/release-completion-finalize.yml

      - name: Normalize formatting
        run: npm run format

      - name: Verify release gate
        run: npm run verify

      - name: Run browser tests
        run: npm run test:e2e

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate diff
        run: git diff --check

      - name: Commit verified repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: complete release verification repairs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
