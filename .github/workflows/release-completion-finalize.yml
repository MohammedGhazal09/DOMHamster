name: Release completion finalizer

on:
  push:
    branches:
      - automation/release-completion-20260828
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-completion-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Verify runtime
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply deterministic release repairs
        run: |
          python3 .github/release-completion-finalize.py
          python3 .github/release-completion-typecheck-round2.py
          python3 .github/release-completion-lint-round3.py

      - name: Remove temporary automation
        run: |
          rm -f \
            .github/release-completion-contract-preserving.py \
            .github/release-completion-repair.py \
            .github/release-completion-typecheck-fixes.py \
            .github/release-completion-finalize.py \
            .github/release-completion-typecheck-round2.py \
            .github/release-completion-lint-round3.py \
            .github/workflows/release-completion-finalize.yml

      - name: Normalize formatting
        run: npm run format

      - name: Verify lint gate
        run: npm run lint

      - name: Verify source
        run: npm run verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Verify bundle budget
        run: npm run verify:bundle

      - name: Verify license policy
        run: npm run verify:licenses

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate diff
        run: git diff --check

      - name: Commit verified repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: complete release verification repairs"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Package failed candidate workspace
        if: failure()
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=coverage \
            --exclude=playwright-report \
            --exclude=test-results \
            -czf /tmp/domhamster-candidate-source.tgz .

      - name: Upload failed candidate workspace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: domhamster-candidate-source-${{ github.run_id }}
          path: /tmp/domhamster-candidate-source.tgz
          retention-days: 3
          if-no-files-found: error
