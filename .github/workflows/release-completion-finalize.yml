name: Release completion finalizer

on:
  push:
    branches:
      - automation/release-completion-20260828
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-completion-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Verify runtime
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Apply confirmed lint repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one patch target in {path_name}, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "scripts/run-release-gate.mjs",
              """  let isFile = false;
          try {
            isFile = statSync(resultsPath).isFile();
          } catch {
            isFile = false;
          }
          if (!isFile) throw new Error(`DOMHAMSTER_EVAL_RESULTS_NOT_FILE:${resultsPath}`);
          """,
              """  let isFile;
          try {
            isFile = statSync(resultsPath).isFile();
          } catch {
            throw new Error(`DOMHAMSTER_EVAL_RESULTS_NOT_FILE:${resultsPath}`);
          }
          if (!isFile) throw new Error(`DOMHAMSTER_EVAL_RESULTS_NOT_FILE:${resultsPath}`);
          """,
          )

          replace_once(
              "src/app/store.ts",
              """export interface AppStore {
            getState(): AppState;
            dispatch(command: Command): Promise<StoreDispatchResult>;
            subscribe(listener: () => void): () => void;
          }
          """,
              """export interface AppStore {
            readonly getState: () => AppState;
            readonly dispatch: (command: Command) => Promise<StoreDispatchResult>;
            readonly subscribe: (listener: () => void) => () => void;
          }
          """,
          )

          replace_once(
              "src/app/browser-runtime.ts",
              """export interface BrowserRuntime {
            readonly store: AppStore;
            readonly capabilityStatus: WebMcpCapabilityStatus;
            readonly persistenceRecovery: PersistenceRecovery | null;
            start(): Promise<void>;
            whenIdle(): Promise<void>;
            getRegistrySnapshot(): WebMcpRegistrySnapshot | null;
            subscribeRegistry(listener: () => void): () => void;
            teardown(): void;
          }
          """,
              """export interface BrowserRuntime {
            readonly store: AppStore;
            readonly capabilityStatus: WebMcpCapabilityStatus;
            readonly persistenceRecovery: PersistenceRecovery | null;
            readonly start: () => Promise<void>;
            readonly whenIdle: () => Promise<void>;
            readonly getRegistrySnapshot: () => WebMcpRegistrySnapshot | null;
            readonly subscribeRegistry: (listener: () => void) => () => void;
            readonly teardown: () => void;
          }
          """,
          )

          replace_once(
              "src/persistence/local-storage.ts",
              """export interface LocalStorageRepository extends StatePersistencePort {
            load(): PersistenceLoadResult;
            clear(): void;
          }
          """,
              """export interface LocalStorageRepository extends StatePersistencePort {
            save(state: AppState): void;
            load(): PersistenceLoadResult;
            clear(): void;
          }
          """,
          )

          replace_once(
              "src/app/StoreConnectedApp.tsx",
              """export interface RegistrySnapshotSource {
            subscribe(listener: () => void): () => void;
            getSnapshot(): WebMcpRegistrySnapshot | null;
          }
          """,
              """export interface RegistrySnapshotSource {
            readonly subscribe: (listener: () => void) => () => void;
            readonly getSnapshot: () => WebMcpRegistrySnapshot | null;
          }
          """,
          )
          replace_once(
              "src/app/StoreConnectedApp.tsx",
              "export function registrySnapshotKey(snapshot: WebMcpRegistrySnapshot | null): string {",
              """// eslint-disable-next-line react-refresh/only-export-components -- Exported for deterministic registry subscription tests.
          export function registrySnapshotKey(snapshot: WebMcpRegistrySnapshot | null): string {""",
          )

          replace_once(
              "src/ui/workflow-commands.ts",
              """export type WorkflowCommandHandler = (
            command: WorkflowCommand,
          ) => StoreDispatchResult | void | Promise<StoreDispatchResult | void>;

          export async function executeWorkflowCommand(
          """,
              """export type WorkflowCommandHandler = (command: WorkflowCommand) => unknown;

          export function isStoreDispatchResult(value: unknown): value is StoreDispatchResult {
            return (
              typeof value === 'object' &&
              value !== null &&
              'ok' in value &&
              typeof value.ok === 'boolean'
            );
          }

          export async function executeWorkflowCommand(
          """,
          )
          replace_once(
              "src/ui/workflow-commands.ts",
              """    const result = await onCommand(command);
              if (result !== undefined && !result.ok) {
                onAnnouncement(`Action was not accepted: ${result.error.code}.`);
                return false;
              }
          """,
              """    const result: unknown = await onCommand(command);
              if (result !== undefined) {
                if (!isStoreDispatchResult(result)) {
                  throw new TypeError('Unexpected workflow command result.');
                }
                if (!result.ok) {
                  onAnnouncement(`Action was not accepted: ${result.error.code}.`);
                  return false;
                }
              }
          """,
          )

          replace_once(
              "src/app/App.tsx",
              """import {
            executeWorkflowCommand,
            type WorkflowCommand,
            type WorkflowCommandHandler,
          } from '../ui/workflow-commands.ts';
          """,
              """import {
            executeWorkflowCommand,
            isStoreDispatchResult,
            type WorkflowCommand,
            type WorkflowCommandHandler,
          } from '../ui/workflow-commands.ts';
          """,
          )
          replace_once(
              "src/app/App.tsx",
              """function ignoreWorkflowCommand(): void {
            // Store-connected rendering supplies the real shared command dispatcher.
          }
          """,
              """function ignoreWorkflowCommand(): undefined {
            // Store-connected rendering supplies the real shared command dispatcher.
            return undefined;
          }
          """,
          )
          replace_once(
              "src/app/App.tsx",
              """        const result = await baseCommandHandler(command);
                  if (result !== undefined && !result.ok) {
                    setRecentErrorCodes((previous) => [...previous, result.error.code].slice(-10));
                  }
                  return result;
          """,
              """        const result: unknown = await baseCommandHandler(command);
                  if (result !== undefined) {
                    if (!isStoreDispatchResult(result)) {
                      throw new TypeError('Unexpected workflow command result.');
                    }
                    if (!result.ok) {
                      setRecentErrorCodes((previous) => [...previous, result.error.code].slice(-10));
                    }
                  }
                  return result;
          """,
          )
          replace_once(
              "src/app/App.tsx",
              """  useEffect(() => {
            if (
              (confirmation === 'cancel-approval' && state.workflowState !== 'APPROVED') ||
              (confirmation === 'discard' &&
                (state.workflowState === 'READY' || state.workflowState === 'COMMITTED'))
            ) {
              setConfirmation(null);
            }
          }, [confirmation, state.workflowState]);
          """,
              """  useEffect(() => {
            const confirmationIsInvalid =
              (confirmation === 'cancel-approval' && state.workflowState !== 'APPROVED') ||
              (confirmation === 'discard' &&
                (state.workflowState === 'READY' || state.workflowState === 'COMMITTED'));
            if (!confirmationIsInvalid) return undefined;

            let active = true;
            queueMicrotask(() => {
              if (active) setConfirmation(null);
            });
            return () => {
              active = false;
            };
          }, [confirmation, state.workflowState]);
          """,
          )

          replace_once(
              "src/ui/AssignmentTable.tsx",
              "import type { WorkflowCommandHandler } from './workflow-commands.ts';",
              "import { isStoreDispatchResult, type WorkflowCommandHandler } from './workflow-commands.ts';",
          )
          replace_once(
              "src/ui/AssignmentTable.tsx",
              """    const result = await onCommand(command);
              if (result !== undefined && !result.ok) {
                onAnnouncement(`Assignment change was not accepted: ${result.error.code}.`);
                return;
              }
          """,
              """    const result: unknown = await onCommand(command);
              if (result !== undefined) {
                if (!isStoreDispatchResult(result)) {
                  throw new TypeError('Unexpected workflow command result.');
                }
                if (!result.ok) {
                  onAnnouncement(`Assignment change was not accepted: ${result.error.code}.`);
                  return;
                }
              }
          """,
          )

          replace_once(
              "src/domain/state-machine.ts",
              """  if (event === 'COMMIT_PLAN') {
            return actor === 'agent' && state === 'APPROVED';
          }

          return false;
          """,
              """  return actor === 'agent' && state === 'APPROVED';
          """,
          )

          replace_once(
              "src/ui/ErrorBoundaryFallback.tsx",
              "import { Component, useEffect, useRef, type ErrorInfo, type ReactNode } from 'react';",
              "import { Component, useEffect, useRef, type ReactNode } from 'react';",
          )
          replace_once(
              "src/ui/ErrorBoundaryFallback.tsx",
              """  override componentDidCatch(_error: unknown, _info: ErrorInfo): void {
            // Rendering exceptions are intentionally not serialized or displayed.
          }
          """,
              """  override componentDidCatch(): void {
            // Rendering exceptions are intentionally not serialized or displayed.
          }
          """,
          )

          replace_once(
              "src/ui/ApprovedBanner.tsx",
              "export function formatApprovalCountdown(milliseconds: number): string {",
              """// eslint-disable-next-line react-refresh/only-export-components -- Pure formatter is exported for unit tests.
          export function formatApprovalCountdown(milliseconds: number): string {""",
          )

          replace_once(
              "tests/app/browser-runtime.test.ts",
              "  async registerTool(tool: unknown, options?: { readonly signal?: AbortSignal }): Promise<void> {",
              "  registerTool(tool: unknown, options?: { readonly signal?: AbortSignal }): void {",
          )
          replace_once(
              "tests/ui/error-boundary-fallback.test.tsx",
              """    const onReset = vi.fn(async () => {
              shouldThrow = false;
            });
          """,
              """    const onReset = vi.fn(() => {
              shouldThrow = false;
            });
          """,
          )

          replace_once(
              "tsconfig.app.json",
              """    "tests/setup.ts",
              "tests/domain/**/*.ts",
          """,
              """    "tests/setup.ts",
              "tests/accessibility/**/*.tsx",
              "tests/domain/**/*.ts",
          """,
          )
          PY

      - name: Remove temporary automation
        run: |
          rm -f \
            .github/release-completion-contract-preserving.py \
            .github/release-completion-repair.py \
            .github/release-completion-typecheck-fixes.py \
            .github/workflows/release-completion-finalize.yml

      - name: Normalize formatting
        run: npm run format

      - name: Verify lint gate
        run: npm run lint

      - name: Verify source
        run: npm run verify

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Verify bundle budget
        run: npm run verify:bundle

      - name: Verify license policy
        run: npm run verify:licenses

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate diff
        run: git diff --check

      - name: Commit verified repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: complete release verification repairs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
