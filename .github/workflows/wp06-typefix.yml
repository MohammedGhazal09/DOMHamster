name: Apply WP06 TypeScript fixes

on:
  push:
    branches: [implementation/wp06-runtime]
    paths:
      - .github/workflows/wp06-typefix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out WP06 branch
        uses: actions/checkout@v7
        with:
          ref: implementation/wp06-runtime
          fetch-depth: 0

      - name: Apply compiler-directed fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/webmcp/handlers.ts')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "const PRIORITY_FILTERS = Object.freeze({\n  URGENT: 'high',\n  HIGH: 'medium',\n  NORMAL: 'low',\n} satisfies Record<string, Priority>);",
                  "const PRIORITY_FILTERS: Readonly<Record<string, Priority>> = Object.freeze({\n  URGENT: 'high',\n  HIGH: 'medium',\n  NORMAL: 'low',\n});",
              ),
              (
                  "const ZONE_FILTERS = Object.freeze({\n  NORTH: 'north',\n  CENTRAL: 'center',\n  EAST: 'east',\n  SOUTH: 'south',\n} satisfies Record<string, Zone>);",
                  "const ZONE_FILTERS: Readonly<Record<string, Zone>> = Object.freeze({\n  NORTH: 'north',\n  CENTRAL: 'center',\n  EAST: 'east',\n  SOUTH: 'south',\n});",
              ),
              (
                  "    return Object.freeze({\n      action,\n      requestId: requiredString(record, 'requestId'),\n      ...(optionalString(record, 'volunteerId') === undefined\n        ? {}\n        : { volunteerId: optionalString(record, 'volunteerId') }),\n      ...(optionalString(record, 'startTime') === undefined\n        ? {}\n        : { startTime: optionalString(record, 'startTime') }),\n    });",
                  "    const volunteerValue = optionalString(record, 'volunteerId');\n    const startTimeValue = optionalString(record, 'startTime');\n    return Object.freeze({\n      action,\n      requestId: requiredString(record, 'requestId'),\n      ...(volunteerValue === undefined ? {} : { volunteerId: volunteerValue }),\n      ...(startTimeValue === undefined ? {} : { startTime: startTimeValue }),\n    });",
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one replacement: {old!r}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')

      - name: Remove one-time workflow
        run: rm .github/workflows/wp06-typefix.yml

      - name: Format corrected source
        run: npx prettier --write src/webmcp/handlers.ts

      - name: Commit TypeScript fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: satisfy strict WP06 handler types'
          git push origin HEAD:implementation/wp06-runtime
