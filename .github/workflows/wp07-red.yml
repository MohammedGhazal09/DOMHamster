name: WP07 RED evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .wp07-red
      - src/app/App.tsx
      - src/ui/**
      - tests/ui/app-shell.test.tsx
      - tests/e2e/ready.spec.ts
      - tsconfig.app.json

permissions:
  contents: read

jobs:
  shell-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install committed dependency graph
        run: npm ci --ignore-scripts

      - name: Observe the expected missing-shell RED result
        if: hashFiles('.wp07-red') != ''
        shell: bash
        run: |
          set +e
          npm run test:run -- tests/ui/app-shell.test.tsx > wp07-red-test.log 2>&1
          test_status=$?
          set -e
          cat wp07-red-test.log

          test "$test_status" -ne 0
          grep -Eqi '(failed to resolve import|cannot find module|could not resolve).*(src/ui/AppHeader|\.\./\.\./src/ui/AppHeader)' wp07-red-test.log
          echo 'DOMHAMSTER_WP07_EXPECTED_RED_CONFIRMED'

      - name: Confirm RED evidence is already recorded
        if: hashFiles('.wp07-red') == ''
        run: echo 'WP07 RED evidence was already recorded; normal CI owns GREEN verification.'
