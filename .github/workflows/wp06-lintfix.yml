name: Apply WP06 lint cleanup

on:
  push:
    branches: [implementation/wp06-runtime]
    paths:
      - .github/workflows/wp06-lintfix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out WP06 branch
        uses: actions/checkout@v7
        with:
          ref: implementation/wp06-runtime
          fetch-depth: 0

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install committed dependency graph
        run: npm ci --ignore-scripts

      - name: Apply test-only lint corrections
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path_name}: expected one occurrence of {old!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'tests/helpers/webmcp-fixtures.ts',
              "    async dispatch() {\n      throw new Error('TEST_REGISTRY_STORE_DISPATCH_NOT_ALLOWED');\n    },",
              "    dispatch() {\n      return Promise.reject(new Error('TEST_REGISTRY_STORE_DISPATCH_NOT_ALLOWED'));\n    },",
          )

          replace_once(
              'tests/webmcp/handlers.test.ts',
              "import { TOOL_NAMES, type ToolName } from '../../src/webmcp/contracts.ts';",
              "import { TOOL_NAMES } from '../../src/webmcp/contracts.ts';",
          )
          replace_once(
              'tests/webmcp/handlers.test.ts',
              "import { validAssignments } from '../fixtures/drafts.ts';\n",
              "",
          )
          replace_once(
              'tests/webmcp/handlers.test.ts',
              "    async dispatch() {\n      throw new Error('TEST_UNEXPECTED_DISPATCH');\n    },",
              "    dispatch() {\n      return Promise.reject(new Error('TEST_UNEXPECTED_DISPATCH'));\n    },",
          )
          replace_once(
              'tests/webmcp/handlers.test.ts',
              "      async dispatch() {\n        throw new Error(sentinel);\n      },",
              "      dispatch() {\n        return Promise.reject(new Error(sentinel));\n      },",
          )
          replace_once(
              'tests/webmcp/handlers.test.ts',
              "        expect(TOOL_NAMES).toContain(action as ToolName);",
              "        expect(TOOL_NAMES).toContain(action);",
          )

          replace_once(
              'tests/webmcp/registry.test.ts',
              "        async () => ({\n          ok: true as const,\n          data: { handler: name },\n          nextActions: [] as const,\n        }),",
              "        () =>\n          Promise.resolve({\n            ok: true as const,\n            data: { handler: name },\n            nextActions: [] as const,\n          }),",
          )

      - name: Remove one-time workflow
        run: rm .github/workflows/wp06-lintfix.yml

      - name: Format corrected files
        run: |
          npx prettier --write \
            src/webmcp/handlers.ts \
            src/webmcp/registry.ts \
            tests/helpers/webmcp-fixtures.ts \
            tests/webmcp/handlers.test.ts \
            tests/webmcp/registry.test.ts

      - name: Commit lint cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'style: resolve WP06 strict-lint findings'
          git push origin HEAD:implementation/wp06-runtime
