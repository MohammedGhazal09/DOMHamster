name: WP01 style autofix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.pull_request.head.ref == 'implementation/wp01-domain-fixture'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the WP01 branch
        uses: actions/checkout@v7
        with:
          ref: implementation/wp01-domain-fixture
          fetch-depth: 0

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install the committed dependency graph
        run: npm ci --ignore-scripts

      - name: Apply deterministic formatting and safe lint fixes
        shell: bash
        run: |
          npm run format
          npm run lint -- --fix || true

      - name: Commit fixes when needed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No style changes were needed.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'style: apply verified WP01 formatting'
          git push origin HEAD:implementation/wp01-domain-fixture
