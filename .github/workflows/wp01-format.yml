name: WP01 branch formatting

on:
  push:
    branches: [implementation/wp01-domain-fixture]
    paths:
      - .github/workflows/wp01-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out WP01 branch
        uses: actions/checkout@v7
        with:
          ref: implementation/wp01-domain-fixture
          fetch-depth: 0

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install committed dependencies
        run: npm ci --ignore-scripts

      - name: Apply repository formatting
        run: npm run format

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/wp01-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No formatting changes were required.'
            exit 0
          fi
          git commit -m 'style: format WP01 domain fixture'
          git push origin HEAD:implementation/wp01-domain-fixture
