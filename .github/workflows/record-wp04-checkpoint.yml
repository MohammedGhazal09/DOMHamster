name: Record verified WP04 checkpoint

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/record-wp04-checkpoint.yml
      - scripts/record-wp04-checkpoint.py

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out verified main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify the WP04 integration parent
        run: git merge-base --is-ancestor 4a740996ab5cc5d2c5bcabb8ef80068579f629bb HEAD

      - name: Record checkpoint 0.18.0
        run: python scripts/record-wp04-checkpoint.py

      - name: Normalize generated Markdown
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in (
              'MASTERPLAN.md',
              'README.md',
              'docs/execution/WP04_STATUS.md',
              'docs/superpowers/plans/2026-08-26-domhamster-implementation.md',
          ):
              path = Path(name)
              lines = path.read_text(encoding='utf-8').splitlines()
              while lines and not lines[-1].strip():
                  lines.pop()
              path.write_text('\n'.join(line.rstrip() for line in lines) + '\n', encoding='utf-8')
          PY

      - name: Remove one-time checkpoint files
        run: |
          rm scripts/record-wp04-checkpoint.py
          rm .github/workflows/record-wp04-checkpoint.yml

      - name: Commit the verified checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: record verified WP04 completion checkpoint'
          git push origin HEAD:main
