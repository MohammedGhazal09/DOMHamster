name: Publish verified PR40 repairs

on:
  push:
    branches:
      - release/manual-completion-20260828
    paths:
      - .github/workflows/publish-pr40-final.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out guarded publication head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decode and apply the verified source patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a494c61bddcefe7dd003db568c0a2ce7833b06cb HEAD

          echo "3a592752ffc3d678a7462a93b46c96ca8d11184309b2ea64550fbd6c88591b56  .github/pr40-final.patch.part1" | sha256sum --check --strict
          echo "2882e6b166cbac6d244e4c856a33048893340a911d23d2527eb8735bf1f86f97  .github/pr40-final.patch.part2" | sha256sum --check --strict
          echo "215dd590fad1ff8a7f3f9a51a082dc6503ce2345711bdc279ea30eec1fed2236  .github/pr40-final.patch.part3" | sha256sum --check --strict
          echo "9a2561cddf594a2bf3b2b6ba5149f1e98e6e2fa0f06f7c6bf973d793b912a8f1  .github/pr40-final.patch.part4" | sha256sum --check --strict
          echo "b8e5a8db7caaee3590a100db0b12c5b687a8b491dd20c1f740803eee84a9fc2d  .github/pr40-final.patch.part5" | sha256sum --check --strict
          echo "05c78e2166aa2775482a8870ed34dbd3c583408c0e0b63639da485d0ee729151  .github/pr40-final.patch.part6" | sha256sum --check --strict
          echo "3d71d094759a3e520a98f83965a1355d6b20fb81ffd96674f6bcb967bfc8be10  .github/pr40-final.patch.part7" | sha256sum --check --strict

          cat .github/pr40-final.patch.part{1..7} > /tmp/pr40-final.patch.xz.b64
          echo "6192204566946f002a6ac7697ba6349f1db3bb36aa2c7c9a2b013795eaab3634  /tmp/pr40-final.patch.xz.b64" | sha256sum --check --strict
          base64 --decode /tmp/pr40-final.patch.xz.b64 > /tmp/pr40-final.patch.xz
          echo "8c18b6265527ffd5246f78f913952dc339a5a91dcb839fd4e0b13a35507fec71  /tmp/pr40-final.patch.xz" | sha256sum --check --strict
          xz --decompress --stdout /tmp/pr40-final.patch.xz > /tmp/pr40-final.patch
          echo "1f01743f471e91e1d27ebba1a094cf0e576ce6b961eb355f8121f5116601d375  /tmp/pr40-final.patch" | sha256sum --check --strict

          git apply --check /tmp/pr40-final.patch
          git apply /tmp/pr40-final.patch
          git rm \
            .github/pr40-final.patch.xz.b64 \
            .github/pr40-final.patch.part1 \
            .github/pr40-final.patch.part2 \
            .github/pr40-final.patch.part3 \
            .github/pr40-final.patch.part4 \
            .github/pr40-final.patch.part5 \
            .github/pr40-final.patch.part6 \
            .github/pr40-final.patch.part7 \
            .github/workflows/export-pr40-runtime.yml \
            .github/workflows/publish-pr40-final.yml
          git diff --check

      - name: Set up exact Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install exact dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Verify repaired source tree
        shell: bash
        run: |
          set -euo pipefail
          npm run verify
          npm run test:e2e
          npm run verify:bundle
          npm run verify:licenses
          npm audit --offline --audit-level=high
          test "$(node scripts/print-fixture-hash.mjs)" = "b861f7e997f2f14e087d209130de7e4aa465d8047110b11872edb7750a2122b1"

      - name: Publish clean source commit
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/pr40-final.patch.xz.b64
          test ! -e .github/pr40-final.patch.part1
          test ! -e .github/pr40-final.patch.part7
          test ! -e .github/workflows/export-pr40-runtime.yml
          test ! -e .github/workflows/publish-pr40-final.yml
          git config user.name "Mohammed Ghazal"
          git config user.email "mohammedghazal01@outlook.com"
          git add --all
          git commit -m "fix: close exact-runtime release findings"
          git push origin HEAD:release/manual-completion-20260828
