name: Generate WP07 visual concepts

on:
  push:
    branches: [implementation/wp07-shell]
    paths:
      - .github/workflows/generate-wp07-concepts.yml
      - scripts/generate-wp07-concepts.mjs
      - docs/design/design-system.md

permissions:
  contents: write

jobs:
  concepts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out WP07 branch
        uses: actions/checkout@v7
        with:
          ref: implementation/wp07-shell
          fetch-depth: 0

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install committed dependency graph
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate the frozen 1440x960 concepts
        run: node scripts/generate-wp07-concepts.mjs

      - name: Verify generated concepts
        run: |
          file docs/design/domhamster-primary-screen.png
          file docs/design/domhamster-approval-state.png
          python - <<'PY'
          import struct
          from pathlib import Path

          for path_name in [
              'docs/design/domhamster-primary-screen.png',
              'docs/design/domhamster-approval-state.png',
          ]:
              path = Path(path_name)
              data = path.read_bytes()
              if len(data) < 20000 or data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'invalid visual concept: {path_name}')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != (1440, 960):
                  raise SystemExit(f'wrong visual-concept size: {path_name} {(width, height)}')
          PY

      - name: Record concept hashes
        run: sha256sum docs/design/domhamster-*.png > docs/design/concept-sha256.txt

      - name: Remove one-time generator
        run: |
          rm scripts/generate-wp07-concepts.mjs
          rm .github/workflows/generate-wp07-concepts.yml

      - name: Commit the approved visual lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'design: lock WP07 visual concepts'
          git push origin HEAD:implementation/wp07-shell
